name: Review gate

# Freshness Phase 4 (2.47.0). Decides review PRs from the scheduled reviewer: label automated-review, opened by the
# repository owner's account from this repository. It runs the base branch's definition (pull_request_target) and
# first checks, executing nothing from the PR, that only review files changed; only then does it run the PR's tests,
# validators and live-data browser suites. review_gate.py decides: merge, hold for the owner (DECISION NEEDED), wait
# (auto-merge off) or fail. After a merge it publishes and verifies the live site within 30 minutes, and reverts the
# merge if that fails. The rules: STRATEGY-REVIEW-POLICY.md, "Current scheduling decision".
# Audit #239 F2: before the merge the gate writes a durable pending record (an issue labelled review-gate-pending), and
# review_gate.py settle finishes from it. If the decide job stops first (cancelled, timed out, runner lost), the
# scheduled resume job finishes the record once that job's time limit has certainly passed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '53 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number || 'resume' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  scope:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'automated-review') &&
      (github.event.action != 'labeled' || github.event.label.name == 'automated-review') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Read the PR head as data
        run: git fetch --no-tags origin "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pr/head"
      - name: Only review files changed (nothing from the PR is executed)
        run: python -B review_gate.py scope --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }}

  checks:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install pinned verification tooling (no browser download)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund
      - name: Python tests
        run: python -B -m unittest discover -s tests -p 'test_static*.py'
      - name: Node tests
        run: node --test tests/*.test.cjs
      - name: Download the live six-rank bundles (sha256 checked against the live manifest)
        run: python -B tests/fetch_live_bundles.py qa/live-bundles
      - name: Validate the reviewed packet against every live rank
        run: python -B review_gate.py validate-live qa/live-bundles/*.json
      - name: Render the live bundles with the reviewed packet
        run: |
          seeds=()
          for bundle in qa/live-bundles/*.json; do seeds+=(--seed "$bundle"); done
          python -B tests/stage_preview.py --output qa/live-site --state-dir qa/live-state "${seeds[@]}"
      - name: Static acceptance and legacy suites on live data
        env:
          START_PREVIEW: '1'
          PREVIEW_URL: http://127.0.0.1:13061/
          PREVIEW_DIR: qa/live-site
          BROWSER_CHANNEL: chrome
        run: node tests/browser_static.cjs
      - name: Design acceptance on live data
        env:
          START_PREVIEW: '1'
          PREVIEW_URL: http://127.0.0.1:13062/
          PREVIEW_DIR: qa/live-site
          BROWSER_CHANNEL: chrome
        run: node tests/browser_design.cjs

  decide:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 150   # an hour for CI, 30 minutes to verify a merge, 30 more to confirm its revert
    permissions:
      contents: write        # merge, and revert if the live site does not verify
      pull-requests: write   # comments and labels
      issues: write          # labels and a revert notice
      actions: write         # dispatch publish.yml: a merge by this token does not trigger it
      checks: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Read the PR head as data
        run: git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pr/head"
      - name: Wait for CI on the PR head
        run: |
          for attempt in $(seq 1 60); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD/check-runs" --jq '[.check_runs[] | select(.name == "verify")] | if length == 0 then "pending" else (.[0].status + ":" + (.[0].conclusion // "")) end')
            case "$state" in
              completed:success) exit 0 ;;
              completed:*) echo "CI did not pass: $state"; exit 1 ;;
            esac
            sleep 60
          done
          echo 'CI did not finish within an hour.'; exit 1
      - name: Decide
        id: gate
        run: python -B review_gate.py decide --base "$BASE" --head "$HEAD" --out gate.json
      - name: Label and comment
        run: |
          for label in 'automated-review' 'DECISION NEEDED' 'gate failed'; do gh label create "$label" --force --color 5319e7 >/dev/null; done
          python -B review_gate.py comment gate.json > comment.md
          gh pr comment "$PR" --body-file comment.md
          case '${{ steps.gate.outputs.decision }}' in
            hold) gh pr edit "$PR" --add-label 'DECISION NEEDED' ;;
            fail) gh pr edit "$PR" --add-label 'gate failed'; exit 1 ;;
          esac
      - name: Get the token that may write to main
        id: writer
        if: steps.gate.outputs.decision == 'merge'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
      - name: Merge, publish and verify the live site (revert if it does not verify)
        if: steps.gate.outputs.decision == 'merge'
        env:
          WRITER: ${{ steps.writer.outputs.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          # The automation App is main's only "always" bypass actor (Agent HQ ruleset autopilot-main). main requires
          # muse-review and independent-verify, which never report on review PRs, so gh's own pre-check calls the PR
          # blocked ("the base branch policy prohibits the merge"); --admin skips that pre-check only, and GitHub then
          # applies the App's bypass. CI ("verify") already passed on this head above. The bypass would also skip the
          # ruleset's up-to-date rule, so the PR must not be behind main.
          # The scope job and the decision read BASE...HEAD for the base the PR had then, and a PR's base can be
          # changed without rerunning this workflow. So right before the merge: the PR still targets main at the same
          # head, and the whole decision (scope, holds, ledgers, grade moves), run again against main as it is now,
          # is still merge.
          target=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.base.ref + " " + .head.sha')
          if [ "$target" != "main $HEAD" ]; then
            gh pr comment "$PR" --body "Not merged: this review PR no longer targets main at the head the gate checked ($target)."
            exit 1
          fi
          git fetch -q origin main
          GITHUB_OUTPUT= python -B review_gate.py decide --base "$(git rev-parse origin/main)" --head "$HEAD" --out gate-now.json >/dev/null
          now=$(python -B -c 'import json; print(json.load(open("gate-now.json"))["decision"])')
          if [ "$now" != merge ]; then
            gh pr comment "$PR" --body "Not merged: decided again against main as it is now, the gate says $now, not merge."
            exit 1
          fi
          behind=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$HEAD" --jq .behind_by)
          if [ "$behind" != 0 ]; then
            gh pr comment "$PR" --body "Not merged: this review PR is $behind commit(s) behind main. Update the branch and the gate decides again."
            exit 1
          fi
          # The durable pending record comes first: from here on a stopped run is finished by the resume job.
          python -B review_gate.py record --pr "$PR" --head "$HEAD" --changes gate-now.json
          GH_TOKEN="$WRITER" gh pr merge "$PR" --admin --merge --match-head-commit "$HEAD"
          # Publish and verify every rank that was live before the merge (gate-now.json expected_ranks); otherwise
          # revert on the newest main, publish again and confirm the revert is live. Each stage is saved to the record,
          # and a merge that is neither verified nor confirmed reverted opens an issue for the owner.
          python -B review_gate.py settle --pr "$PR"

  resume:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write        # push a revert
      pull-requests: write   # comments
      issues: write          # the pending records and alarms
      actions: write         # dispatch publish.yml
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Any pending merge whose own run stopped?
        id: pending
        run: python -B review_gate.py pending
      - name: Get the token that may write to main
        id: writer
        if: steps.pending.outputs.count != '0'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
      - name: Finish the pending merges
        if: steps.pending.outputs.count != '0'
        env:
          WRITER: ${{ steps.writer.outputs.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python -B review_gate.py resume
