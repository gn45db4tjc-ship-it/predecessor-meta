name: Verify changes

# Runs on every pull request and on release branches. It never collects, publishes or deploys:
# the preview it tests is rendered from the committed public seed with no network access.
on:
  pull_request:
  push:
    branches: ['release/**']

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Python suite (publication policy, validation, audit reproductions)
        run: python -B -m unittest discover -s tests -p 'test_static*.py' -v
      - name: JavaScript suite (recommendation engine, audit reproductions)
        run: node --test tests/*.test.cjs
      - name: Install pinned verification tooling (no browser download)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund
      - name: Browser reproductions and guards against a seed-rendered preview
        env:
          START_PREVIEW: '1'
          BROWSER_CHANNEL: chrome
        run: node tests/browser_audit_regressions.cjs
      - name: Offline cache lifecycle with the real service worker (release upgrade, captive portal, network down)
        env:
          BROWSER_CHANNEL: chrome
        run: node tests/browser_offline_cache.cjs
      - name: Quick companion, selected builds, skill points and accessibility
        env:
          START_PREVIEW: '1'
          PREVIEW_URL: http://127.0.0.1:12941/
          BROWSER_CHANNEL: chrome
        run: node tests/browser_companion_simple.cjs
      - name: Previous-dataset role statistics survive a patch rollover
        env:
          START_PREVIEW: '1'
          PREVIEW_URL: http://127.0.0.1:12973/
          BROWSER_CHANNEL: chrome
        run: node tests/browser_role_statistics.cjs
      - name: Mobile visual layout, large text, contrast and saved selections
        env:
          START_PREVIEW: '1'
          PREVIEW_URL: http://127.0.0.1:12980/
          BROWSER_CHANNEL: chrome
        run: node tests/browser_visual_polish.cjs
      - name: Show the browser verdicts
        if: always()
        run: cat qa/audit-regressions-browser.json || true
      - name: Home-screen app upgrade preserves active choices and offline data
        env:
          START_PREVIEW: '1'
          BROWSER_CHANNEL: chrome
        run: node tests/browser_app_updates.cjs
      - name: Show app upgrade verdicts
        if: always()
        run: cat qa/app-updates-edge.json || true
