name: Publish Windows-collected data
on:
  push:
    branches: [data-updates]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the canonical main-branch publisher
        # Reusable workflows inherit the caller's ref and therefore its cache scope.
        # Main dispatch makes PC arrivals, daily runs and patch checks share state.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main
