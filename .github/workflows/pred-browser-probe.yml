name: Pred public browser diagnostic
on:
  pull_request:
    paths:
      - tests/pred_public_browser_probe.cjs
      - .github/workflows/pred-browser-probe.yml
permissions:
  contents: read
jobs:
  public-page:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: node tests/pred_public_browser_probe.cjs
        env:
          BROWSER_CHANNEL: chrome
