/* ============================================================================

*{box-sizing:border-box}body{margin:0;background:var(--bg)}

/* ---- type scale: 12 caption · 13 support · 14 secondary · 16 body · 18 h3 · 20 h2 · 26 h1 · 24 figure ---- */
h1,h2,h3,p{margin-top:0}
h1{font-family:var(--sans);font-size:var(--t-4xl);font-weight:700;letter-spacing:-.3px;line-height:1.15;margin-bottom:var(--s2)}

h3{font-size:var(--t-base);font-weight:650;line-height:1.3;margin-bottom:var(--s2)}
p{line-height:1.55;max-width:var(--prose)}
.muted{color:var(--muted)}
small{color:var(--muted);font-size:var(--t-sm);line-height:1.45}
.eyebrow{font-family:var(--mono);font-size:var(--t-xs);font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:var(--s2)}
.positive{color:var(--green)}.negative{color:var(--red)}.calculated{color:var(--blue)}.reviewed{color:var(--gold-text)}
.item-name .warning,small.warning,p.warning{color:var(--amber)}
.big{font-family:var(--mono);font-size:var(--t-2xl);font-weight:500;letter-spacing:-.3px;line-height:1.1}
.nowrap{white-space:nowrap}
.pre{white-space:pre-wrap;line-height:1.6;overflow-wrap:anywhere}
.hide{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.spacer{height:var(--s3)}
.divider{height:1px;background:var(--line);margin:var(--s4) 0}
/* ---- controls ---- */
button{cursor:pointer;border:1px solid var(--control-line);border-radius:var(--radius-md);background:var(--surface-2);color:var(--text);padding:var(--s2) var(--s3);min-height:36px;line-height:1.3;font-weight:600;font-size:var(--t-md)}
button:hover{background:var(--surface-3);border-color:var(--control-hover)}
button:disabled{cursor:not-allowed;opacity:.55}
.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--indicator);font-weight:700;border-radius:var(--radius-pill)}

.quiet{background:transparent;font-weight:600}
.quiet:hover{background:var(--surface-2)}
.text-button{border:0;background:none;padding:0;min-height:0;text-align:left;color:inherit;font-weight:inherit;font-size:inherit;border-radius:var(--radius-md)}
.text-button:hover{background:none;color:var(--gold-text)}
.danger{color:var(--red)}
input,select{background:var(--inset);color:var(--text);border:1px solid var(--control-line);border-radius:var(--radius-md);padding:var(--s2) var(--s3);max-width:100%;min-height:36px;font-size:var(--t-md)}
select{padding-right:var(--s6)}
input[type=checkbox]{accent-color:var(--gold);width:17px;height:17px;min-height:0;vertical-align:middle;padding:0}
label{display:inline-flex;align-items:center;gap:var(--s2);color:var(--text-2);font-size:var(--t-md)}
.toolbar input[type=checkbox]{width:18px;height:18px;min-height:18px;flex:0 0 18px}
label:has(input[type=checkbox]){min-height:36px;flex-wrap:nowrap}
.skip{position:absolute;left:236px;top:-100px;background:var(--gold);color:var(--gold-ink);z-index:20;padding:var(--s2) var(--s4);border-radius:var(--radius-md)}
.skip:focus{top:8px}
/* ---- shell: rail + workspace ---- */
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:var(--rail);border-right:1px solid var(--line);padding:var(--s4) var(--s3);display:flex;flex-direction:column;gap:var(--s4);overflow:auto}
.brand{display:flex;align-items:center;gap:var(--s2);font-family:var(--serif);font-size:var(--t-lg);letter-spacing:-.2px;font-weight:700;line-height:1.2;padding:var(--s2) var(--s2) var(--s3);color:var(--text)}
.brand small{display:block;font-family:var(--mono);font-size:var(--t-3xs);letter-spacing:1.6px;color:var(--gold-text);font-weight:500;text-transform:uppercase}
.mark{width:13px;height:13px;border:2px solid var(--indicator);transform:rotate(45deg);flex:none;margin:0 var(--s2) 0 var(--s1)}

.nav-group:first-child{padding-top:0}
.nav{border:0;background:none;text-align:left;font-size:var(--t-md);padding:var(--s2) var(--s3);min-height:36px;color:var(--text-2);font-weight:600;border-left:3px solid transparent;border-radius:0 var(--radius-md) var(--radius-md) 0;display:flex;align-items:center;gap:var(--s2)}
.nav:hover{background:var(--surface-2);color:var(--text)}
.nav[aria-current=page]{background:var(--surface-2);color:var(--text);border-left-color:var(--indicator)}
.navnum{display:none}
.theme-toggle{font-size:var(--t-xs);min-height:32px;padding:var(--s1) var(--s3);align-self:flex-start;margin:0 var(--s2)}
.sidebar-foot{margin-top:auto;font-size:var(--t-xs);line-height:1.55;color:var(--muted);padding:0 var(--s2)}
.sidebar-foot .connection{display:block;margin-bottom:var(--s2);color:var(--text-2);font-size:var(--t-2xs);letter-spacing:.6px;text-transform:uppercase;line-height:1.5}
.workspace{min-width:0;background-image:radial-gradient(900px 420px at 85% -10%,var(--glow),transparent 60%)}
.workspace,.grid>*,.panel{min-width:0}
/* top bar: context (rank) on the left, actions on the right */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);min-height:56px;padding:var(--s2) var(--gutter);border-bottom:1px solid var(--line);background:var(--rail)}
.topbar .tools{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;width:100%}
.topbar .tools label{font-size:var(--t-sm);color:var(--muted);gap:var(--s2)}
.topbar .tools label.finder{margin-right:auto}
.topbar .tools label.finder input{min-width:220px;background:var(--surface-2)}
.topbar .tools label select{font-size:var(--t-md);font-weight:650;color:var(--gold-text);background:var(--accent-fill);border-color:var(--accent-line);border-radius:var(--radius-pill);min-width:150px}
.topbar .tools button{font-size:var(--t-sm);min-height:34px;padding:var(--s1-5) var(--s3)}
.topbar .tools #refresh{background:var(--surface-2);color:var(--text);border-color:var(--control-line);font-weight:600}
.topbar .tools #refresh:hover{background:var(--surface-3)}
.connection{font-size:var(--t-xs);color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:var(--s1-5);vertical-align:middle}
/* status strip: patch cells inline, then one status line, then compact freshness + notices */
.patch-strip{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s6);padding:var(--s1-5) var(--gutter);background:var(--surface);border-bottom:1px solid var(--line)}
.patch-cell{display:flex;align-items:baseline;gap:var(--s2);padding:var(--s0-5) 0;font-size:var(--t-sm);min-width:0}
.patch-cell>div{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap}
.patch-cell small{font-family:var(--mono);font-size:var(--t-2xs);letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:500;white-space:nowrap}
.patch-cell strong{font-size:var(--t-md);font-weight:650;color:var(--text)}
.patch-cell a{font-size:var(--t-xs);color:var(--muted)}.patch-cell .status-pill{color:var(--muted)}
.status-pill{color:var(--gold-text);box-shadow:inset 0 0 0 1px var(--line)}
.progress{padding:var(--s1) var(--gutter);border-bottom:1px solid var(--line);font-size:var(--t-sm);color:var(--text-2);min-height:30px;display:flex;align-items:center;gap:var(--s2)}
.progress:before{content:"";display:block;width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}

.freshness{max-width:none;margin:0;padding:var(--s1-5) var(--gutter) 0;font-size:var(--t-xs);color:var(--muted);line-height:1.45}
.source-notices{max-width:none;margin:0;padding:0 var(--gutter)}
.source-notices:empty{display:none}

.source-notices summary:before{left:2px;top:9px}
.source-notices details>.detail-content{padding:var(--s2) 0 var(--s3)}
/* 2.28.0: one status line; the schedule, announcements and source notices sit in a collapsed Status details panel. Material

.status-line{display:flex;align-items:center;flex-wrap:wrap;gap:0 var(--s4);padding:0 var(--gutter);border-bottom:1px solid var(--line);min-height:28px}
.status-line .progress{flex:1 1 20em;min-width:0;padding:var(--s1) 0;border-bottom:0;min-height:0}

.status-toggle:hover{background:none;color:var(--text)}

.workspace:not(.status-open) #status-panel{display:none}
.status-panel{background:var(--surface);border-bottom:1px solid var(--line);padding:var(--s2) 0 var(--s3)}
.status-panel .freshness{padding-top:0}
.status-panel .alert-list-head{font-size:var(--t-sm);font-weight:600;color:var(--amber);margin:var(--s2) 0 var(--s1)}
#material-notices .note{margin:var(--s1) 0 0;padding:var(--s1) var(--s3);font-size:var(--t-sm)}
details.note.evidence-line{padding:0;margin:0 0 var(--s2)}

.alert-list .alert{padding:var(--s2) 0;border-bottom:1px solid var(--line);font-size:var(--t-sm);line-height:1.5;max-width:var(--prose)}

main{max-width:var(--content-max);margin:0 auto;padding:var(--s5) var(--gutter) 64px}

.page-head h1{margin-bottom:var(--s1)}
.page-head .eyebrow{margin-bottom:var(--s1)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s3) var(--s4);flex-wrap:wrap;margin:var(--s3) 0}
.toolbar-group{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.toolbar>span{font-size:var(--t-sm);color:var(--muted)}
.tabs{display:flex;gap:var(--s0-5);flex-wrap:wrap;border-bottom:1px solid var(--line)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--s4) var(--s4)}
.panel>h2:first-child,.panel>h3:first-child{margin-top:0}
.table-panel{padding:0;overflow:auto}
.empty{padding:var(--s5) var(--s4);border:1px dashed var(--line-strong);border-radius:var(--radius-lg);text-align:center;color:var(--muted);line-height:1.6;max-width:none}
.footer{font-size:var(--t-xs);color:var(--muted);margin-top:var(--s4);line-height:1.6;max-width:var(--prose)}
.grid{display:grid;gap:var(--s3)}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.flex{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
/* notes: quiet informational, amber warning; never louder than data */
.note{border-left:3px solid var(--control-line);background:var(--surface-2);padding:var(--s2) var(--s4);font-size:var(--t-sm);line-height:1.55;color:var(--text-2);border-radius:0 var(--radius-md) var(--radius-md) 0;margin:var(--s3) 0;max-width:none}
.note.warning{border-color:var(--amber);background:var(--amber-tint);color:var(--amber-ink)}
.note p{max-width:var(--prose)}.note p:last-child{margin-bottom:0}
.note.rank-evidence{border-left-color:var(--blue);padding:var(--s1-5) var(--s3);font-size:var(--t-xs);color:var(--muted);margin:0 0 var(--s3)}
.note.rank-evidence strong{color:var(--text-2);font-weight:600}
.note.rank-evidence br{display:none}
.source-line{display:flex;justify-content:space-between;gap:var(--s3);color:var(--muted);font-size:var(--t-xs);line-height:1.5;margin:var(--s3) 0;max-width:none}
.source-line a{font-size:var(--t-xs)}
/* chips: flat, never bordered, never clickable; the word carries the meaning */
/* Chip: the one pill-shaped component. Evidence tags, status pills and state chips add colour, never geometry. */
.chip{display:inline-block;padding:var(--s0-5) var(--s2);border-radius:var(--radius-pill);font-size:var(--t-xs);font-weight:600;letter-spacing:.2px;line-height:1.4;vertical-align:middle;white-space:nowrap}
.tag{border:0;background:var(--surface-3);color:var(--text-2)}
.tag.observed{color:var(--green);background:var(--green-tint)}
.tag.reviewed{color:var(--gold-text);background:var(--gold-tint)}
.tag.warning{color:var(--amber);background:var(--amber-tint-2)}
.tag.calculated{color:var(--blue);background:var(--blue-tint)}
.tag.official{color:var(--official);background:var(--official-tint);font-family:var(--mono)}
.tag.saved{color:var(--text-2);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.tag.observed:before{content:"● "}.tag.calculated:before{content:"◇ "}.tag.reviewed:before{content:"✦ "}.tag.warning:before{content:"! "}.tag.official:before{content:"▢ "}.tag.saved:before{content:"⟳ "}
/* disclosures: blue chevron = opens; hover confirms */
details{border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface-2);margin:var(--s2) 0}
summary{padding:var(--s2) var(--s3) var(--s2) var(--s6);cursor:pointer;font-size:var(--t-sm);font-weight:600;line-height:1.4;color:var(--text-2);position:relative;list-style:none;border-radius:var(--radius-md)}
summary::-webkit-details-marker{display:none}
summary:before{content:"";position:absolute;left:12px;top:calc(50% - 4px);width:6px;height:6px;border-right:2px solid var(--blue);border-bottom:2px solid var(--blue);transform:rotate(-45deg);transition:transform .15s}
details[open]>summary:before{transform:rotate(45deg)}
summary:hover{color:var(--text);background:var(--surface-3)}
details>.detail-content{padding:var(--s1) var(--s4) var(--s3)}
details details{background:var(--surface)}
/* portraits & hero cells */
.hero-cell{display:inline-flex;align-items:center;gap:var(--s2);font-weight:650;color:var(--text)}
.hero-cell .name{font-weight:650;letter-spacing:.1px}
.hero-cell small{display:block;font-weight:400;letter-spacing:0;margin-top:var(--s0-5)}
.text-button.hero-cell .name{text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:4px}
.text-button.hero-cell:hover .name{color:var(--gold-text);text-decoration-color:var(--gold-text)}
.portrait{position:relative;width:40px;height:40px;flex-shrink:0;display:inline-grid;place-items:center;overflow:hidden;border:1px solid var(--line-strong);border-radius:var(--radius-md);background:var(--surface-3);color:var(--text-2);font-weight:700;font-size:var(--t-sm)}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.portrait.large{width:104px;height:104px;border-radius:var(--radius-lg);font-size:var(--t-3xl);box-shadow:var(--shadow-lg)}
.portrait.tiny{width:28px;height:28px;border-radius:var(--radius-sm);font-size:var(--t-3xs)}
.tier{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:26px;padding:0 var(--s2);border-radius:var(--radius-sm);background:var(--surface-3);font-size:var(--t-sm);font-weight:800;color:var(--on-strong)}
.tier-s{background:var(--gold);color:var(--gold-ink)}.tier-a{background:var(--tier-a-fill);color:var(--tier-a-ink)}.tier-b{background:var(--tier-b-fill);color:var(--tier-b-ink)}.tier-c{background:var(--tier-c-fill);color:var(--tier-c-ink)}.tier-d{background:var(--tier-d-fill);color:var(--tier-d-ink)}
/* ---- meta table ---- */
.meta-table{width:100%;border-collapse:collapse;white-space:nowrap}
.meta-table th{font-family:var(--mono);font-size:var(--t-2xs);text-transform:uppercase;letter-spacing:.7px;color:var(--muted);text-align:right;font-weight:500;padding:var(--s2) var(--s4);background:var(--surface-2);border-bottom:1px solid var(--line)}
.meta-table th:first-child,.meta-table td:first-child{text-align:left}
.meta-table th button{padding:0;background:transparent;border:0;font-size:inherit;letter-spacing:inherit;text-transform:inherit;min-height:0;color:inherit;font-weight:inherit}
.meta-table th button:hover{color:var(--text)}
.meta-table td{text-align:right;padding:var(--s2) var(--s4);border-top:1px solid var(--line);font-size:var(--t-md)}
.meta-table td strong{font-family:var(--mono);font-size:var(--t-base);font-weight:500}
.meta-table tr:hover td{background:var(--surface-2)}
.meta-table .hero-cell{display:flex;align-items:center;gap:var(--s3)}
[data-meta-decision]{display:inline-flex;align-items:center;gap:var(--s2);min-height:32px;padding:var(--s1) var(--s2) var(--s1) var(--s1);font-size:var(--t-xs);color:var(--text-2);font-weight:500;border-color:transparent;background:transparent}
[data-meta-decision] small{text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px;font-size:var(--t-xs)}
[data-meta-decision]:hover{border-color:var(--control-line);background:var(--surface-3)}
.quick-stats [data-meta-decision]{padding:var(--s1) var(--s1);justify-content:flex-end}
.hero-header .quick-stats>div{padding:var(--s2) var(--s4);border-radius:var(--radius-lg);border:1px solid var(--line);background:var(--surface-2);text-align:left}
.hero-header .quick-stats>div:last-child{background:var(--observed-tint);border-color:var(--observed-line)}
.hero-header .quick-stats>div:first-child{background:var(--reviewed-tint);border-color:var(--reviewed-line)}
.meta-table [data-meta-decision] small{font-size:var(--t-xs)}
.meta-table td .quiet{min-height:32px;padding:var(--s1) var(--s3);font-size:var(--t-sm);border-color:transparent;color:var(--blue)}
.meta-table td .quiet:hover{border-color:var(--control-line);color:var(--text)}
.meta-table td small.warning{display:block;font-size:var(--t-xs)}
.meta-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--s4);align-items:start}
.meta-layout>*{min-width:0}
.meta-aside{display:grid;gap:var(--s3);position:sticky;top:var(--s3)}
.meta-aside .panel{padding:var(--s3) var(--s4)}
.meta-aside details{margin:0}
.role-priority .flex{gap:var(--s1-5);margin:var(--s2) 0}
.role-priority .hero-cell{font-size:var(--t-md)}
.role-priority small{display:block;margin-top:var(--s2);font-size:var(--t-xs)}
/* ---- hero page ---- */
.hero-header{display:flex;align-items:center;gap:var(--s4);margin:var(--s3) 0 var(--s4);padding:var(--s3) 0 var(--s4);border-bottom:1px solid var(--line)}
.hero-header h1{font-size:var(--t-5xl);margin-bottom:var(--s1)}
.hero-header .summary{flex:1;min-width:0}
.hero-header .summary label{margin-top:var(--s1)}
.hero-header .quick-stats{display:flex;gap:var(--s5);align-items:center}
.hero-header .quick-stats>div{text-align:right}
.hero-header .quick-stats small{display:block;font-size:var(--t-xs);margin-top:var(--s0-5)}
.hero-header .quick-stats .big{font-size:var(--t-3xl)}
.hero-intro{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;margin:var(--s2) 0 var(--s3)}
.hero-intro h2{margin:0}
.hero-intro p{margin:0;font-size:var(--t-sm);color:var(--muted)}
/* partner cards */
.partner{display:flex;flex-direction:column;gap:var(--s2);min-width:0;padding:var(--s3) var(--s4)}
.partner-head{display:flex;align-items:center;gap:var(--s2)}
.partner-head .name{font-family:var(--serif);font-weight:500;font-size:var(--t-xl);line-height:1.1}
.partner-head small{font-size:var(--t-xs)}
.partner p{font-size:var(--t-sm);margin:0;color:var(--text-2);max-width:none}
.partner p.baseline{margin:0}
.partner .foot{margin-top:auto;padding-top:var(--s1)}
.partner .foot button{font-size:var(--t-sm);min-height:32px;padding:var(--s1) var(--s3)}
.partner .baseline strong{color:var(--text)}
.partner .metric-row small{max-width:210px}
.metric-row{display:flex;gap:var(--s4) var(--s5);align-items:flex-start;flex-wrap:wrap}
.metric-row>div{min-width:0;padding:var(--s2) var(--s3);border-radius:var(--radius-lg);background:var(--surface-2);border:1px solid var(--line);flex:1 1 150px}
.metric-row>div:has(.tag.observed){background:var(--observed-tint);border-color:var(--observed-line)}
.metric-row>div:has(.tag.calculated){background:var(--calculated-tint);border-color:var(--calculated-line)}
.metric-row>div:has(.tag.reviewed){background:var(--reviewed-tint);border-color:var(--reviewed-line)}
.metric-row>div:has(.tag.official){background:var(--official-tint);border-color:var(--official-line)}
.metric-row>div .tag{background:transparent;padding:0;font-family:var(--mono);font-weight:500;letter-spacing:.4px;text-transform:uppercase;font-size:var(--t-3xs)}
.metric-row small{display:block;font-size:var(--t-xs);max-width:170px;margin-top:var(--s1);line-height:1.35}
.metric-row strong{font-family:var(--mono);font-size:var(--t-xl);font-weight:500;letter-spacing:-.2px;line-height:1.1;display:block}
.baseline{font-size:var(--t-xs);line-height:1.55;color:var(--muted);padding-top:var(--s2);border-top:1px solid var(--line)}
/* ---- builds ---- */
.build-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s3)}
.build-head h3{font-family:var(--serif);font-size:var(--t-xl);font-weight:500;margin-bottom:var(--s0-5)}
.build-head .eyebrow{margin-bottom:var(--s0-5)}
.build-path{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));list-style:none;padding:0;margin:var(--s3) 0;gap:var(--s2);counter-reset:slot}
.build-path li{counter-increment:slot;position:relative;background:var(--inset);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--s4) var(--s1-5) var(--s2);min-height:0;text-align:center;font-size:var(--t-xs);overflow-wrap:anywhere;display:flex;flex-direction:column;align-items:center;gap:var(--s1)}
.build-path li:before{content:counter(slot);position:absolute;left:7px;top:5px;font-size:var(--t-2xs);font-weight:700;color:var(--muted)}
.build-path li small{display:block;margin-top:0;font-size:var(--t-xs)}
.build-path li .tag{margin-top:var(--s0-5)}
.item-button{border:0;background:none;font-size:var(--t-xs);padding:var(--s0-5);display:inline-flex;flex-direction:column;align-items:center;gap:var(--s1-5);min-height:0;font-weight:600;max-width:100%;border-radius:var(--radius-md)}
.item-button img{width:40px;height:40px;border-radius:var(--radius-sm);object-fit:contain;background:var(--icon-plate)}
.item-button:hover{background:none;color:var(--gold-text)}
.item-button:hover img{outline:2px solid var(--indicator);outline-offset:1px}
.item-name{font-size:var(--t-sm);font-weight:600;line-height:1.25;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.item-name small{display:block;margin-top:var(--s0-5);font-size:var(--t-xs);line-height:1.35;text-decoration:none}
.loadout-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s2);margin:var(--s3) 0}
.loadout-strip>div{background:var(--inset);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--s2) var(--s1-5);text-align:center;min-width:0}
.loadout-strip>div>small{display:block;font-size:var(--t-xs);letter-spacing:.7px;text-transform:uppercase;font-weight:700;margin-bottom:var(--s1)}
.loadout-strip .item-button img{width:34px;height:34px}
.loadout-strip .item-name{font-size:var(--t-xs)}
.loadout-strip .item-name small{display:none}
.choice{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);border-bottom:1px solid var(--line);padding:var(--s2) 0;font-size:var(--t-sm)}
.choice:last-child{border:0}
.choice small{text-align:right}
.skill-order{display:flex;flex-wrap:wrap;gap:var(--s1);margin:var(--s2) 0}
.skill-order span{min-width:36px;border:1px solid var(--line);border-radius:var(--radius-sm);text-align:center;padding:var(--s1);font-size:var(--t-xs);background:var(--inset)}
.skill-order small{display:block;font-size:var(--t-xs);line-height:1.1}
.variant-pills{display:flex;flex-wrap:wrap;gap:var(--s2)}
.variant-pills button{font-size:var(--t-sm);text-align:left;min-height:0;padding:var(--s2) var(--s3)}
.variant-pills button[aria-pressed=true]{border-color:var(--indicator);background:var(--gold-tint);color:var(--gold-text)}
.variant-pills small{display:block;margin-top:var(--s1)}.variant-pills button[aria-pressed=true] small{color:var(--text-2)}
.review-item-reasons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}
.review-item-reasons article{border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--s3);min-width:0}
.review-item-reasons .item-button{flex-direction:row;gap:var(--s2);margin-bottom:var(--s2);text-align:left}
.review-item-reasons .item-name{font-size:var(--t-md)}
.review-item-reasons p{font-size:var(--t-md);margin-bottom:var(--s2)}
.review-item-reasons .quiet{font-size:var(--t-xs);min-height:32px;padding:var(--s1) var(--s2)}
.builds-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}
.build-card{padding:var(--s3) var(--s4)}
.build-card .comp-head{margin-bottom:var(--s2)}
.build-card .comp-head small{text-align:right}
.build-card .build-path{margin:var(--s2) 0}
.build-card>p{font-size:var(--t-md);color:var(--text-2)}
/* ---- planner / draft / live ---- */
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s2);margin:var(--s3) 0}
.slot{padding:var(--s2) var(--s3);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);min-width:0}
.slot label{font-size:var(--t-2xs);letter-spacing:.7px;text-transform:uppercase;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:stretch;gap:var(--s1-5)}
.slot select{font-size:var(--t-md);width:100%;padding:var(--s1-5) var(--s2);text-transform:none;letter-spacing:0;font-weight:600;color:var(--text)}
.slot .slot-art{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s2);font-size:var(--t-sm);min-height:30px;color:var(--text-2)}
.slot .slot-art small{font-size:var(--t-xs)}
.slot.enemy{border-color:var(--enemy-line);background:var(--enemy-tint)}
.slot.enemy label{color:var(--enemy-text)}
.coverage{display:flex;gap:var(--s1-5);flex-wrap:wrap;margin:var(--s2) 0}
.coverage span{font-size:var(--t-xs);border:0;padding:var(--s1) var(--s2);border-radius:var(--radius-sm);color:var(--text-2);background:var(--surface-3)}
.coverage .has{color:var(--green);background:var(--green-tint)}
.coverage .lacks{color:var(--amber);background:var(--amber-tint)}
.coverage+small{display:block;font-size:var(--t-xs)}
.comp-head{display:flex;justify-content:space-between;align-items:center;gap:var(--s3)}
.comp-picks{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s3);margin:var(--s3) 0}
.comp-pick{flex:1;min-width:120px;display:flex;align-items:center;gap:var(--s2);font-size:var(--t-sm)}
.comp-pick small{display:block;font-size:var(--t-xs)}
.comp-number{color:var(--gold-text);font-size:var(--t-xs);font-weight:800;letter-spacing:1px}
.comp-card{padding:var(--s3) var(--s4)}
.comp-card p{font-size:var(--t-sm);max-width:none}
.comp-card .metric-row strong{font-size:var(--t-xl)}
.comp-card details{margin:var(--s1-5) 0}
.comp-card .divider{margin:var(--s3) 0}
.selection-chips{display:flex;flex-wrap:wrap;gap:var(--s1-5);margin-top:var(--s2)}
.selection-chips button{font-size:var(--t-xs);padding:var(--s1) var(--s2);min-height:30px}
.inline-select{max-width:220px}
.guided-options .grid.two{gap:var(--s3)}
.reviewed-composition,.reviewed-counter,.strategic-profile{padding:var(--s3) var(--s4)}
.reviewed-composition h3,.strategic-profile h2{font-size:var(--t-base)}
.reviewed-counter p,.reviewed-composition p,.strategic-profile p{font-size:var(--t-sm)}
.strategic-profile small{display:block;margin:var(--s2) 0}
.live-context{margin:var(--s3) 0}
.live-context .toolbar{margin:var(--s2) 0}
.live-context p{font-size:var(--t-sm)}
.me-select{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;margin:var(--s3) 0}
.me-select label{font-size:var(--t-md);color:var(--text);font-weight:650;max-width:100%;min-width:0}
.me-select select{font-weight:650;min-width:240px;border-color:var(--accent-line);background:var(--accent-fill);border-radius:var(--radius-pill)}
/* ---- lists / tables / metrics ---- */
.metrics-list{display:grid;grid-template-columns:1fr auto;gap:var(--s1-5) var(--s4);font-size:var(--t-sm);margin:0}
.metrics-list dt{color:var(--muted)}
.metrics-list dd{margin:0;overflow-wrap:anywhere;text-align:right}
.list{padding-left:var(--s5);line-height:1.6;max-width:var(--prose)}
.list li{margin-bottom:var(--s1-5)}
.table-small{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
.table-small th,.table-small td{text-align:left;padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);vertical-align:top}
.table-small th{font-family:var(--mono);color:var(--muted);font-size:var(--t-2xs);text-transform:uppercase;letter-spacing:.6px;font-weight:500}
.table-small td.num{text-align:right}
.table-small tr:hover td{background:var(--surface-2)}
.table-scroll{overflow:auto}
.library-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:var(--s2)}
.library-grid .panel{padding:var(--s2) var(--s3);display:flex;align-items:center;gap:var(--s2)}
.library-grid .item-button{flex-direction:row;text-align:left;gap:var(--s2);min-width:0}
.library-grid .item-name{font-size:var(--t-sm)}
.library-grid p{margin:0;font-size:var(--t-xs);color:var(--muted);max-width:none}
.library-grid .meta{min-width:0;flex:1}
.comparison{background:var(--surface-2);padding:var(--s3);border-radius:var(--radius-md);font-size:var(--t-sm)}
.status-ok{color:var(--green)}.status-bad{color:var(--red)}.status-warn{color:var(--amber)}
.verdict{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3);margin:var(--s3) 0 var(--s4)}
.verdict>div{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:var(--radius-md);padding:var(--s2) var(--s4)}
.verdict-warn>div{border-left-color:var(--amber)}
.verdict strong{display:block;font-family:var(--mono);font-size:var(--t-base);font-weight:500}
.verdict small{display:block;font-size:var(--t-xs);margin-top:var(--s0-5)}
/* ---- dialog / toast ---- */
dialog{border:1px solid var(--line-strong);border-radius:var(--radius-lg);background:var(--surface);color:var(--text);width:min(780px,92vw);max-height:88vh;padding:var(--s5);box-shadow:var(--shadow-dialog)}
dialog::backdrop{background:var(--backdrop)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);position:sticky;top:calc(-1 * var(--s5));background:var(--surface);padding:var(--s2) 0 var(--s3);z-index:2;border-bottom:1px solid var(--line);margin-bottom:var(--s3)}
.dialog-head h2{margin:0;font-size:var(--t-xl)}
dialog .metric-row{margin:var(--s3) 0}
.toast{position:fixed;bottom:20px;right:20px;max-width:440px;padding:var(--s3) var(--s4);background:var(--surface-3);color:var(--text);border:1px solid var(--control-line);border-radius:var(--radius-md);box-shadow:var(--shadow-toast);z-index:30;font-size:var(--t-sm)}
.share-link{display:grid;gap:var(--s2);margin:var(--s4) 0}
.share-link input{width:100%;min-width:0}
.detail-content a{overflow-wrap:anywhere}
.detail-content pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:var(--t-xs)}
