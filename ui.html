<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark"><title>Predecessor · Meta & Planning</title>
<script>try{if(localStorage.getItem('predecessor-theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ============================================================================
   Predecessor Meta — design system (dark by default, light by opt-in).
   Tokens → base → shell → components → pages → responsive. Class names are the
   contract with ui.js / rank_view.js / static_client.js and the browser tests.
   Control vocabulary: primary (gold fill) · secondary (outlined) · text link ·
   disclosure (chevron) · chip (flat, never bordered, never clickable).
   ============================================================================ */
:root{
  --bg:#0c151a;--rail:#091014;--surface:#132128;--surface-2:#1a2c35;--surface-3:#22363f;--inset:#0e191f;
  --line:#23363f;--line-strong:#34505b;--control-line:#6f95a0;
  --text:#e6eef0;--text-2:#bfcdd2;--muted:#8aa0a7;
  --gold:#d8b25c;--gold-soft:#e6c777;--gold-ink:#14110a;
  --green:#74e0c1;--red:#ff8a9a;--blue:#9fb3ff;--amber:#f0c27a;
  --gold-text:#e6c777;--focus:#d8b25c;--on-strong:#fff;--control-hover:#8a9cc0;
  --green-tint:#15271f;--gold-tint:#2a2614;--amber-tint:#2b2419;--amber-tint-2:#2b201a;--blue-tint:#182238;--amber-ink:#f1e3c8;
  --observed-tint:rgba(116,224,193,.10);--observed-line:rgba(116,224,193,.34);--calculated-tint:rgba(159,179,255,.10);--calculated-line:rgba(159,179,255,.34);--reviewed-tint:rgba(216,178,92,.12);--reviewed-line:rgba(216,178,92,.36);
  --accent-fill:#1f2a2a;--accent-line:#b8975a;--enemy-line:#6a4552;--enemy-tint:#1b1520;--enemy-text:#d9a2b0;
  --glow:rgba(216,178,92,.07);--shadow-lg:0 10px 30px rgba(0,0,0,.45);--shadow-dialog:0 30px 100px #0009;--shadow-toast:0 10px 40px #0008;--backdrop:#060a13cc;
  --icon-plate:var(--surface-3);
  color-scheme:dark;
  --serif:"Newsreader","Georgia","Times New Roman",serif;--mono:"IBM Plex Mono","Consolas","Cascadia Mono",monospace;
  --radius:14px;--radius-sm:10px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --rail-w:200px;--gutter:32px;--content-max:1720px;--prose:76ch;
  font-family:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;color:var(--text);background:var(--bg);font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;
}
/* light theme: same tokens, opt-in through the theme toggle (stored as predecessor-theme); the default stays dark */
:root[data-theme=light]{
  color-scheme:light;
  --bg:#edf1f0;--rail:#e3e9e8;--surface:#ffffff;--surface-2:#f3f6f5;--surface-3:#e4eae9;--inset:#f7f9f8;
  --line:#d3dcdb;--line-strong:#b4c2c0;--control-line:#6b8891;--control-hover:#4f6c75;
  --text:#14232a;--text-2:#33464e;--muted:#5a6f77;
  --gold:#cfa84f;--gold-soft:#dcb964;--gold-ink:#14110a;--gold-text:#7a5a10;--focus:#2f55b8;--on-strong:#14232a;
  --green:#17735a;--red:#b0273a;--blue:#3550b8;--amber:#8a5a0a;
  --green-tint:#dff3ec;--gold-tint:#f6ecd2;--amber-tint:#f7ecd6;--amber-tint-2:#f7ecd6;--blue-tint:#e4e9fb;--amber-ink:#4a3204;
  --observed-tint:rgba(23,115,90,.09);--observed-line:rgba(23,115,90,.38);--calculated-tint:rgba(53,80,184,.07);--calculated-line:rgba(53,80,184,.35);--reviewed-tint:rgba(154,122,44,.12);--reviewed-line:rgba(154,122,44,.42);
  --accent-fill:#faf3e2;--accent-line:#9a7a2c;--enemy-line:#d9a9b4;--enemy-tint:#fbeef1;--enemy-text:#8a2e42;
  --icon-plate:#2b3f48;--glow:rgba(154,122,44,.10);--shadow-lg:0 10px 30px rgba(20,35,42,.20);--shadow-dialog:0 30px 100px rgba(20,35,42,.35);--shadow-toast:0 10px 40px rgba(20,35,42,.25);--backdrop:rgba(20,35,42,.55);
}
:root[data-theme=light] .tier-a{background:#8fd9c1}:root[data-theme=light] .tier-b{background:#c3d1ea}:root[data-theme=light] .tier-c{background:#f7c3a6}:root[data-theme=light] .tier-d{background:#ffa3af}
*{box-sizing:border-box}body{margin:0;background:var(--bg)}
a{color:var(--blue);text-underline-offset:3px}
button,input,select{font:inherit}
button,a,input,select,summary{outline-offset:3px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
/* ---- type scale: 12 caption · 13 support · 14 secondary · 16 body · 18 h3 · 20 h2 · 26 h1 · 24 figure ---- */
h1,h2,h3,p{margin-top:0}
h1{font-family:var(--serif);font-size:32px;font-weight:500;letter-spacing:-.3px;line-height:1.15;margin-bottom:var(--s2)}
h2{font-family:var(--serif);font-size:24px;font-weight:500;letter-spacing:-.2px;line-height:1.2;margin-bottom:var(--s3)}
h3{font-size:16px;font-weight:650;line-height:1.3;margin-bottom:var(--s2)}
p{line-height:1.55;max-width:var(--prose)}
.muted{color:var(--muted)}
small{color:var(--muted);font-size:13px;line-height:1.45}
.eyebrow{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:var(--s2)}
.positive{color:var(--green)}.negative{color:var(--red)}.calculated{color:var(--blue)}.reviewed{color:var(--gold-text)}
.item-name .warning,small.warning,p.warning{color:var(--amber)}
.big{font-family:var(--mono);font-size:24px;font-weight:500;letter-spacing:-.3px;line-height:1.1}
.nowrap{white-space:nowrap}
.pre{white-space:pre-wrap;line-height:1.6;overflow-wrap:anywhere}
.hide{display:none!important}
.spacer{height:var(--s3)}
.divider{height:1px;background:var(--line);margin:var(--s4) 0}
/* ---- controls ---- */
button{cursor:pointer;border:1px solid var(--control-line);border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text);padding:7px 12px;min-height:36px;line-height:1.3;font-weight:600;font-size:14px}
button:hover{background:var(--surface-3);border-color:var(--control-hover)}
button:disabled{cursor:not-allowed;opacity:.55}
.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700;border-radius:999px}
.primary:hover{background:var(--gold-soft);color:var(--gold-ink);border-color:var(--gold-soft)}
.quiet{background:transparent;font-weight:600}
.quiet:hover{background:var(--surface-2)}
.text-button{border:0;background:none;padding:0;min-height:0;text-align:left;color:inherit;font-weight:inherit;font-size:inherit;border-radius:var(--radius-sm)}
.text-button:hover{background:none;color:var(--gold-text)}
.danger{color:var(--red)}
input,select{background:var(--inset);color:var(--text);border:1px solid var(--control-line);border-radius:var(--radius-sm);padding:7px 10px;max-width:100%;min-height:36px;font-size:14px}
select{padding-right:28px}
input[type=checkbox]{accent-color:var(--gold);width:17px;height:17px;min-height:0;vertical-align:middle;padding:0}
label{display:inline-flex;align-items:center;gap:var(--s2);color:var(--text-2);font-size:14px}
.toolbar input[type=checkbox]{width:18px;height:18px;min-height:18px;flex:0 0 18px}
label:has(input[type=checkbox]){min-height:36px;flex-wrap:nowrap}
.skip{position:absolute;left:236px;top:-100px;background:var(--gold);color:var(--gold-ink);z-index:20;padding:10px 14px;border-radius:var(--radius-sm)}
.skip:focus{top:8px}
/* ---- shell: rail + workspace ---- */
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:var(--rail);border-right:1px solid var(--line);padding:var(--s4) var(--s3);display:flex;flex-direction:column;gap:var(--s4);overflow:auto}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:18px;letter-spacing:0;font-weight:500;line-height:1.2;padding:var(--s2) var(--s2) var(--s3);color:var(--text)}
.brand small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:1.6px;color:var(--gold-text);font-weight:500;text-transform:uppercase}
.mark{width:13px;height:13px;border:2px solid var(--gold);transform:rotate(45deg);flex:none;margin:0 8px 0 4px}
.sidebar nav{display:grid;gap:2px}
.nav-group{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:var(--s3) var(--s3) var(--s1);margin:0}
.nav-group:first-child{padding-top:0}
.nav{border:0;background:none;text-align:left;font-size:14px;padding:8px 12px;min-height:36px;color:var(--text-2);font-weight:600;border-left:3px solid transparent;border-radius:0 var(--radius-sm) var(--radius-sm) 0;display:flex;align-items:center;gap:8px}
.nav:hover{background:var(--surface-2);color:var(--text)}
.nav[aria-current=page]{background:var(--surface-2);color:var(--text);border-left-color:var(--gold)}
.navnum{display:none}
.theme-toggle{font-size:12px;min-height:32px;padding:5px 10px;align-self:flex-start;margin:0 var(--s2)}
.sidebar-foot{margin-top:auto;font-size:12px;line-height:1.55;color:var(--muted);padding:0 var(--s2)}
.sidebar-foot .connection{display:block;margin-bottom:var(--s2);color:var(--text-2);font-size:11px;letter-spacing:.6px;text-transform:uppercase;line-height:1.5}
.workspace{min-width:0;background-image:radial-gradient(900px 420px at 85% -10%,var(--glow),transparent 60%)}
.workspace,.grid>*,.panel{min-width:0}
/* top bar: context (rank) on the left, actions on the right */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);min-height:56px;padding:var(--s2) var(--gutter);border-bottom:1px solid var(--line);background:var(--rail)}
.topbar .tools{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;width:100%}
.topbar .tools label{font-size:13px;color:var(--muted);gap:var(--s2)}
.topbar .tools label.finder{margin-right:auto}
.topbar .tools label.finder input{min-width:220px;background:var(--surface-2)}
.topbar .tools label select{font-size:15px;font-weight:650;color:var(--gold-text);background:var(--accent-fill);border-color:var(--accent-line);border-radius:999px;min-width:150px}
.topbar .tools button{font-size:13px;min-height:34px;padding:6px 12px}
.topbar .tools #refresh{background:var(--surface-2);color:var(--text);border-color:var(--control-line);font-weight:600}
.topbar .tools #refresh:hover{background:var(--surface-3)}
.connection{font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:middle}
/* status strip: patch cells inline, then one status line, then compact freshness + notices */
.patch-strip{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s6);padding:6px var(--gutter);background:var(--surface);border-bottom:1px solid var(--line)}
.patch-cell{display:flex;align-items:baseline;gap:var(--s2);padding:2px 0;font-size:13px;min-width:0}
.patch-cell>div{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap}
.patch-cell small{font-family:var(--mono);font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:500;white-space:nowrap}
.patch-cell strong{font-size:14px;font-weight:650;color:var(--text)}
.patch-cell a,.patch-cell .status-pill{font-size:12px;color:var(--muted)}
.status-pill{font-size:12px;color:var(--gold-text)}
.progress{padding:5px var(--gutter);border-bottom:1px solid var(--line);font-size:13px;color:var(--text-2);min-height:30px;display:flex;align-items:center;gap:var(--s2)}
.progress:before{content:"";display:block;width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.progress.busy:before{background:var(--gold);animation:pulse 1.2s ease-in-out infinite}
.progress.failed{color:var(--amber);font-weight:600}
.progress.failed:before{background:var(--amber)}
@keyframes pulse{50%{opacity:.35}}
.freshness{max-width:none;margin:0;padding:6px var(--gutter) 0;font-size:12px;color:var(--muted);line-height:1.45}
.source-notices{max-width:none;margin:0;padding:0 var(--gutter)}
.source-notices:empty{display:none}
.source-notices details,.source-notices .cached-notice{margin:4px 0 0;background:transparent;border:0}
.source-notices summary{padding:4px 0 4px 18px;font-size:13px;color:var(--amber);min-height:0}
.source-notices summary:before{left:2px;top:9px}
.source-notices details>.detail-content{padding:var(--s2) 0 var(--s3)}
.alert-list .alert{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.5;max-width:var(--prose)}
.alert strong{display:block;color:var(--text)}
/* ---- main ---- */
main{max-width:var(--content-max);margin:0 auto;padding:var(--s5) var(--gutter) 64px}
.page-head{display:flex;justify-content:space-between;gap:var(--s5);align-items:flex-end;margin-bottom:var(--s4);border-bottom:1px solid var(--line);padding-bottom:var(--s3)}
.page-head p{color:var(--muted);margin-bottom:0;font-size:14px;line-height:1.5;max-width:96ch}
.page-head h1{margin-bottom:var(--s1)}
.page-head .eyebrow{margin-bottom:var(--s1)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s3) var(--s4);flex-wrap:wrap;margin:var(--s3) 0}
.toolbar-group{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.toolbar>span{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;color:var(--text-2);border-bottom:2px solid transparent;border-radius:0;padding:8px 14px;font-size:14px;min-height:38px;margin-bottom:-1px}
.tabs button:hover{background:var(--surface-2);color:var(--text)}
.tabs button[aria-selected=true]{color:var(--text);border-color:var(--gold);background:transparent}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin:var(--s5) 0 var(--s3)}
.section-title h2{margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:var(--s4) 18px}
.panel>h2:first-child,.panel>h3:first-child{margin-top:0}
.table-panel{padding:0;overflow:auto}
.empty{padding:var(--s5) var(--s4);border:1px dashed var(--line-strong);border-radius:var(--radius);text-align:center;color:var(--muted);line-height:1.6;max-width:none}
.footer{font-size:12px;color:var(--muted);margin-top:var(--s4);line-height:1.6;max-width:var(--prose)}
.grid{display:grid;gap:var(--s3)}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.flex{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
/* notes: quiet informational, amber warning; never louder than data */
.note{border-left:3px solid var(--control-line);background:var(--surface-2);padding:10px 14px;font-size:13px;line-height:1.55;color:var(--text-2);border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin:var(--s3) 0;max-width:none}
.note.warning{border-color:var(--amber);background:var(--amber-tint);color:var(--amber-ink)}
.note p{max-width:var(--prose)}.note p:last-child{margin-bottom:0}
.note.rank-evidence{border-left-color:var(--blue);padding:6px 12px;font-size:12px;color:var(--muted);margin:0 0 var(--s3)}
.note.rank-evidence strong{color:var(--text-2);font-weight:600}
.note.rank-evidence br{display:none}
.source-line{display:flex;justify-content:space-between;gap:var(--s3);color:var(--muted);font-size:12px;line-height:1.5;margin:var(--s3) 0;max-width:none}
.source-line a{font-size:12px}
/* chips: flat, never bordered, never clickable; the word carries the meaning */
.tag{display:inline-block;border:0;background:var(--surface-3);padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.2px;color:var(--text-2);line-height:1.4;vertical-align:middle}
.tag.observed{color:var(--green);background:var(--green-tint)}
.tag.reviewed{color:var(--gold-text);background:var(--gold-tint)}
.tag.warning{color:var(--amber);background:var(--amber-tint-2)}
.tag.calculated{color:var(--blue);background:var(--blue-tint)}
.tag.observed:before{content:"● "}.tag.calculated:before{content:"◇ "}.tag.reviewed:before{content:"✦ "}.tag.warning:before{content:"! "}
/* disclosures: blue chevron = opens; hover confirms */
details{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-2);margin:var(--s2) 0}
summary{padding:9px 12px 9px 30px;cursor:pointer;font-size:13px;font-weight:600;line-height:1.4;color:var(--text-2);position:relative;list-style:none;border-radius:var(--radius-sm)}
summary::-webkit-details-marker{display:none}
summary:before{content:"";position:absolute;left:12px;top:13px;width:6px;height:6px;border-right:2px solid var(--blue);border-bottom:2px solid var(--blue);transform:rotate(-45deg);transition:transform .15s}
details[open]>summary:before{transform:rotate(45deg)}
summary:hover{color:var(--text);background:var(--surface-3)}
details>.detail-content{padding:4px 14px 14px}
details details{background:var(--surface)}
/* portraits & hero cells */
.hero-cell{display:inline-flex;align-items:center;gap:10px;font-weight:650;color:var(--text)}
.hero-cell .name{font-weight:650;letter-spacing:.1px}
.hero-cell small{display:block;font-weight:400;letter-spacing:0;margin-top:2px}
.text-button.hero-cell .name{text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:4px}
.text-button.hero-cell:hover .name{color:var(--gold-text);text-decoration-color:var(--gold-text)}
.portrait{position:relative;width:40px;height:40px;flex-shrink:0;display:inline-grid;place-items:center;overflow:hidden;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface-3);color:var(--text-2);font-weight:700;font-size:13px}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.portrait.large{width:104px;height:104px;border-radius:16px;font-size:28px;box-shadow:var(--shadow-lg)}
.portrait.tiny{width:28px;height:28px;border-radius:5px;font-size:10px}
.tier{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:26px;padding:0 7px;border-radius:5px;background:var(--surface-3);font-size:13px;font-weight:800;color:var(--on-strong)}
.tier-s{background:var(--gold);color:var(--gold-ink)}.tier-a{background:#70cbb0;color:#0b2520}.tier-b{background:#a6bbdd;color:#152338}.tier-c{background:#f7ae86;color:#382112}.tier-d{background:#ff8091;color:#351019}
/* ---- meta table ---- */
.meta-table{width:100%;border-collapse:collapse;white-space:nowrap}
.meta-table th{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);text-align:right;font-weight:500;padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.meta-table th:first-child,.meta-table td:first-child{text-align:left}
.meta-table th button{padding:0;background:transparent;border:0;font-size:inherit;letter-spacing:inherit;text-transform:inherit;min-height:0;color:inherit;font-weight:inherit}
.meta-table th button:hover{color:var(--text)}
.meta-table td{text-align:right;padding:8px 16px;border-top:1px solid var(--line);font-size:15px}
.meta-table td strong{font-family:var(--mono);font-size:16px;font-weight:500}
.meta-table tr:hover td{background:var(--surface-2)}
.meta-table .hero-cell{display:flex;align-items:center;gap:12px}
[data-meta-decision]{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:3px 8px 3px 3px;font-size:12px;color:var(--text-2);font-weight:500;border-color:transparent;background:transparent}
[data-meta-decision] small{text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px;font-size:12px}
[data-meta-decision]:hover{border-color:var(--control-line);background:var(--surface-3)}
.quick-stats [data-meta-decision]{padding:3px 4px;justify-content:flex-end}
.hero-header .quick-stats>div{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);text-align:left}
.hero-header .quick-stats>div:last-child{background:var(--observed-tint);border-color:var(--observed-line)}
.hero-header .quick-stats>div:first-child{background:var(--reviewed-tint);border-color:var(--reviewed-line)}
.meta-table [data-meta-decision] small{font-size:12px}
.meta-table td .quiet{min-height:32px;padding:4px 10px;font-size:13px;border-color:transparent;color:var(--blue)}
.meta-table td .quiet:hover{border-color:var(--control-line);color:var(--text)}
.meta-table td small.warning{display:block;font-size:12px}

 .topbar .tools label{flex:1 1 38%;font-size:0;line-height:0;gap:0;margin:0;min-width:0}
 .topbar .tools label.finder{flex:1 1 54%}
 .topbar .tools label select,.topbar .tools label.finder input{font-size:15px;line-height:1.3;margin:0;width:100%;min-width:0;min-height:42px}
 .topbar .tools button{flex:1 1 auto;font-size:13px;min-height:40px;padding:6px 8px}
 /* status: a compact strip instead of a boxed button, a banner and a notice */
 .mobile-status{margin:8px 16px 0;width:calc(100% - 32px);min-height:40px;font-size:13px;padding:6px 10px}
 .progress{padding:6px 16px;font-size:13px;min-height:0;line-height:1.4;align-items:flex-start}
 .progress:before{margin-top:6px}
 .progress.failed{font-weight:500}
 .freshness{font-size:12px}
 .source-notices summary{font-size:13px;padding:4px 0 4px 18px;min-height:0}
 .note.rank-evidence{font-size:12px;padding:6px 10px;margin:0 0 10px;line-height:1.45}
 main{padding:14px 16px 48px}
 .page-head{margin-bottom:10px;padding-bottom:8px}
 .page-head h1,h1{font-size:26px}
 .page-head p{font-size:13px}
 /* hero header: portrait, name and role, then the two evidence tiles side by side */
 .hero-header{flex-wrap:wrap;gap:10px 12px;margin:6px 0 10px;padding:6px 0 12px}
 .hero-header .summary{flex:1 1 60%}
 .hero-header h1{font-size:32px}
 .hero-header .quick-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;align-items:stretch}
 .hero-header .quick-stats>div{text-align:left;padding:8px 10px}
 .hero-header .quick-stats .big{font-size:24px}
 .quick-stats [data-meta-decision]{justify-content:flex-start;flex-wrap:wrap;text-align:left;padding:2px 0;min-height:0}
 .quick-stats [data-meta-decision] small{text-align:left}
 /* tables: tighter rows, headers never split mid-word */
 .meta-table th,.meta-table td{padding:8px 6px}
 .meta-table th{font-size:10.5px;letter-spacing:.4px}
 .meta-table .portrait{width:28px;height:34px;min-width:28px}
 .table-small th{font-size:10.5px;letter-spacing:.4px;white-space:nowrap;padding:8px}
 .table-small td{padding:8px;font-size:13px}
 .source-table{min-width:440px}
 /* headline figures never break across two lines inside a tile */
 .metric-row strong,.metric-row .lead strong{font-size:20px;white-space:nowrap}
 .comp-card .metric-row strong{font-size:19px}
 .metric-row>div{padding:8px 10px}
 /* section headers keep their action on one line */
 .section-title{flex-wrap:wrap;gap:6px 10px;margin:16px 0 10px}
 .section-title h2,.section-title h3{flex:1 1 180px;margin:0}
 .section-title button{white-space:nowrap;flex:none}
 .slots{gap:8px}
 .slot{padding:8px 10px}
 .slot .slot-art{margin-top:6px;min-height:26px}
 .library-grid .panel{padding:6px 10px}
 .toast{bottom:8px;left:8px;right:8px;font-size:13px;padding:10px 12px}
}
